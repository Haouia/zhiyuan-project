# 预发基础设施简版：带就绪/存活探针与资源限制。
# 生产使用 StatefulSet + PVC 或云托管服务；备份与索引重建演练见 scripts/ops/。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: rag-knowledge
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: mysql } }
  template:
    metadata: { labels: { app: mysql } }
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          ports: [{ name: mysql, containerPort: 3306 }]
          envFrom:
            - configMapRef: { name: rag-config }
            - secretRef: { name: rag-secrets }
          readinessProbe:
            exec: { command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 --silent"] }
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: mysql }
            periodSeconds: 20
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
          volumeMounts: [{ name: data, mountPath: /var/lib/mysql }]
      volumes: [{ name: data, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata: { name: mysql, namespace: rag-knowledge }
spec:
  selector: { app: mysql }
  ports: [{ name: mysql, port: 3306, targetPort: mysql }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: rag-knowledge
spec:
  replicas: 1
  selector: { matchLabels: { app: kafka } }
  template:
    metadata: { labels: { app: kafka } }
    spec:
      containers:
        - name: kafka
          image: apache/kafka:4.2.2
          ports: [{ name: kafka, containerPort: 9092 }]
          envFrom: [{ configMapRef: { name: rag-config } }]
          readinessProbe:
            tcpSocket: { port: kafka }
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: kafka }
            periodSeconds: 20
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata: { name: kafka, namespace: rag-knowledge }
spec:
  selector: { app: kafka }
  ports: [{ name: kafka, port: 9092, targetPort: kafka }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opensearch
  namespace: rag-knowledge
spec:
  replicas: 1
  selector: { matchLabels: { app: opensearch } }
  template:
    metadata: { labels: { app: opensearch } }
    spec:
      containers:
        - name: opensearch
          image: public.ecr.aws/opensearchproject/opensearch:3.10.0
          ports: [{ name: http, containerPort: 9200 }]
          envFrom: [{ configMapRef: { name: rag-config } }]
          readinessProbe:
            httpGet: { path: /_cluster/health, port: http }
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: http }
            periodSeconds: 20
          resources:
            requests: { cpu: 300m, memory: 1Gi }
            limits: { cpu: "2", memory: 2Gi }
---
apiVersion: v1
kind: Service
metadata: { name: opensearch, namespace: rag-knowledge }
spec:
  selector: { app: opensearch }
  ports: [{ name: http, port: 9200, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: rag-knowledge
spec:
  replicas: 1
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis } }
    spec:
      containers:
        - name: redis
          image: redis:7
          ports: [{ name: redis, containerPort: 6379 }]
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: redis }
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 300m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata: { name: redis, namespace: rag-knowledge }
spec:
  selector: { app: redis }
  ports: [{ name: redis, port: 6379, targetPort: redis }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nacos
  namespace: rag-knowledge
spec:
  replicas: 1
  selector: { matchLabels: { app: nacos } }
  template:
    metadata: { labels: { app: nacos } }
    spec:
      containers:
        - name: nacos
          image: nacos/nacos-server:v2.3.2
          ports: [{ name: http, containerPort: 8848 }]
          envFrom:
            - configMapRef: { name: rag-config }
            - secretRef: { name: rag-secrets }
          readinessProbe:
            httpGet: { path: /nacos/v1/console/health/readiness, port: http }
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: http }
            periodSeconds: 20
          resources:
            requests: { cpu: 150m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata: { name: nacos, namespace: rag-knowledge }
spec:
  selector: { app: nacos }
  ports: [{ name: http, port: 8848, targetPort: http }]
