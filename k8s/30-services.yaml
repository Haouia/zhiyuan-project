apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: rag-knowledge
spec:
  type: ClusterIP
  selector: { app: gateway }
  ports: [{ name: http, port: 8080, targetPort: http }]
---
apiVersion: v1
kind: Service
metadata:
  name: doc-service
  namespace: rag-knowledge
spec:
  selector: { app: doc-service }
  ports: [{ name: http, port: 8082, targetPort: http }]
---
apiVersion: v1
kind: Service
metadata:
  name: search-service
  namespace: rag-knowledge
spec:
  selector: { app: search-service }
  ports: [{ name: http, port: 8083, targetPort: http }]
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: rag-knowledge
spec:
  selector: { app: ai-service }
  ports: [{ name: http, port: 8081, targetPort: http }]
---
apiVersion: v1
kind: Service
metadata:
  name: metric-service
  namespace: rag-knowledge
spec:
  selector: { app: metric-service }
  ports: [{ name: http, port: 8090, targetPort: http }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rag-web
  namespace: rag-knowledge
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
spec:
  ingressClassName: nginx
  rules:
    - host: rag.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway
                port: { name: http }
