apiVersion: apps/v1
kind: Deployment
metadata:
  name: metric-service
  namespace: rag-knowledge
  labels: { app: metric-service }
spec:
  replicas: 1
  revisionHistoryLimit: 10
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector: { matchLabels: { app: metric-service } }
  template:
    metadata:
      labels: { app: metric-service }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 65532, fsGroup: 65532 }
      containers:
        - name: metric-service
          image: ragknowledge/metric-service:0.1.0-phase5curr
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8090 }]
          envFrom:
            - configMapRef: { name: rag-config }
            - secretRef: { name: rag-secrets }
          startupProbe:
            exec:
              command:
                - python
                - -c
                - >-
                  import os,urllib.request as http;
                  http.urlopen(http.Request('http://127.0.0.1:8090/internal/v1/health',
                  headers={'Authorization':'Bearer '+os.environ['RAG_METRIC_TOKEN']}),timeout=2).close()
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - >-
                  import os,urllib.request as http;
                  http.urlopen(http.Request('http://127.0.0.1:8090/internal/v1/health',
                  headers={'Authorization':'Bearer '+os.environ['RAG_METRIC_TOKEN']}),timeout=2).close()
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - >-
                  import os,urllib.request as http;
                  http.urlopen(http.Request('http://127.0.0.1:8090/internal/v1/health',
                  headers={'Authorization':'Bearer '+os.environ['RAG_METRIC_TOKEN']}),timeout=2).close()
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 300m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
