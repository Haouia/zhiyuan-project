server:
  port: 8080
spring:
  application:
    name: gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${RAG_OIDC_ISSUER}
          jwk-set-uri: ${RAG_OIDC_JWKS_URI}
          audiences: ${RAG_OIDC_AUDIENCE:rag-api}
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 2000
            response-timeout: 15s
rag:
  gateway-doc-token: ${RAG_GATEWAY_DOC_TOKEN}
  gateway-ai-token: ${RAG_GATEWAY_AI_TOKEN}
  oidc-client-id: ${RAG_OIDC_CLIENT_ID:rag-web}
  eval-dir: ${RAG_EVAL_DIR:/app/eval}
  metric-url: ${RAG_METRIC_URL:http://metric-service:8090}
  metric-token: ${RAG_METRIC_TOKEN:}
  keycloak-admin-url: ${RAG_KEYCLOAK_ADMIN_URL:http://keycloak:8080}
  keycloak-admin-realm: ${RAG_KEYCLOAK_ADMIN_REALM:rag-local}
  keycloak-admin-user: ${RAG_KEYCLOAK_ADMIN_USER:}
  keycloak-admin-password: ${RAG_KEYCLOAK_ADMIN_PASSWORD:}
  invite-dir: ${RAG_INVITE_DIR:/app/data}
  services:
    gateway: ${RAG_SERVICE_GATEWAY:http://127.0.0.1:8080}
    doc: ${RAG_SERVICE_DOC:http://doc-service:8082}
    search: ${RAG_SERVICE_SEARCH:http://search-service:8083}
    ai: ${RAG_SERVICE_AI:http://ai-service:8081}
    metric: ${RAG_SERVICE_METRIC:http://metric-service:8090}
    keycloak: ${RAG_SERVICE_KEYCLOAK:http://keycloak:9000}
    opensearch: ${RAG_SERVICE_OPENSEARCH:http://opensearch:9200}
    nacos: ${RAG_SERVICE_NACOS:http://nacos:8848}
    model-primary: ${RAG_SERVICE_MODEL_PRIMARY:http://model-primary:8095}
    model-backup: ${RAG_SERVICE_MODEL_BACKUP:http://model-backup:8096}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] traceId=%X{traceId:-} %logger{24} : %msg%n"
